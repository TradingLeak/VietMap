name: Kiểm tra biên dịch iOS nhanh
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - name: Compile unsigned app without data package
        run: |
          set +e
          set -o pipefail
          xcodebuild build -project VietNav.xcodeproj -scheme VietNav -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$RUNNER_TEMP/build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/build.log" <<'PY'
          import sys
          lines = open(sys.argv[1], errors='replace').read().splitlines()
          errors = list(dict.fromkeys(line for line in lines if 'error:' in line.lower()))
          message = '\n'.join(errors[-50:] if errors else lines[-50:])
          print('::error::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
            exit "$status"
          fi
