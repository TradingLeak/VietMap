name: iOS Build & Test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Choose available iPhone simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json, os
          devices = json.load(open(os.environ['RUNNER_TEMP'] + '/devices.json'))['devices']
          choices = [(runtime, d) for runtime, group in devices.items() if 'iOS' in runtime for d in group if d['isAvailable'] and d['name'].startswith('iPhone')]
          if not choices: raise SystemExit('No available iPhone simulator')
          runtime, dev = sorted(choices, key=lambda x: (x[0], x[1]['name']), reverse=True)[0]
          print('Selected', runtime, dev['name'], dev['udid'])
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('SIMULATOR_ID=' + dev['udid'] + '\n')
          PY
      - name: Build
        run: xcodebuild build-for-testing -project VietNav.xcodeproj -scheme VietNav -destination "platform=iOS Simulator,id=$SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO
      - name: Test
        run: xcodebuild test-without-building -project VietNav.xcodeproj -scheme VietNav -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/TestResults.xcresult
          if-no-files-found: ignore
  data-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install osmium
      - run: bash -n scripts/*.sh
      - run: python -m unittest discover -s Tests/python -v
