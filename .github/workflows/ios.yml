name: iOS · Test & Unsigned IPA

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'VietMap/**'
      - 'VietMap.xcodeproj/**'
      - 'VietMapTests/**'
      - 'VietMapUITests/**'
      - 'Packages/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'VietMap/**'
      - 'VietMap.xcodeproj/**'
      - 'VietMapTests/**'
      - 'VietMapUITests/**'
      - 'Packages/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle ID (ESign profile must permit this ID)'
        required: true
        default: 'vn.tradingleak.vietmap'
        type: string
      version:
        description: 'Marketing version, e.g. 1.0.0'
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project, tools & fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 (Node 24)
        with:
          python-version: '3.12'
      - run: python3 scripts/generate_project.py --check
      - run: python3 scripts/validate_repo.py
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n scripts/build_ipa.sh

  ios:
    name: Test iOS & package ESign IPA
    needs: validate
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 (Node 24)
        with:
          python-version: '3.12'
      - name: Toolchain information
        run: |
          mkdir -p artifacts
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes
      - name: Test traffic, navigation & trip core
        run: |
          set -o pipefail
          swift test --package-path Packages/VietMapCore --parallel 2>&1 | tee artifacts/core-tests.log
      - name: Select available iPhone simulator
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available --json | python3 scripts/select_simulator.py)"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Boot iPhone simulator explicitly
        timeout-minutes: 7
        run: xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Build app and test runners for simulator
        timeout-minutes: 10
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project VietMap.xcodeproj -scheme VietMap -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/VietMap-TestBuild" \
            -resultBundlePath artifacts/Build-Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee artifacts/build-for-tests.log
      - name: Test iOS storage and settings
        timeout-minutes: 5
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project VietMap.xcodeproj -scheme VietMap -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/VietMap-TestBuild" \
            -resultBundlePath artifacts/Unit-Tests.xcresult \
            -only-testing:VietMapTests -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee artifacts/ios-unit-tests.log
      - name: Test demo HUD and data-management UI
        timeout-minutes: 8
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project VietMap.xcodeproj -scheme VietMap -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/VietMap-TestBuild" \
            -resultBundlePath artifacts/UI-Tests.xcresult \
            -only-testing:VietMapUITests -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee artifacts/ios-ui-tests.log
      - name: Archive arm64 device app & create unsigned IPA
        env:
          BUNDLE_ID: ${{ inputs.bundle_id || 'vn.tradingleak.vietmap' }}
          APP_VERSION: ${{ inputs.version || '1.0.0' }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/build_ipa.sh
      - name: Upload ESign-ready package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 (Node 24)
        with:
          name: VietMap-unsigned-ipa
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/VietMap-unsigned.ipa
            artifacts/SHA256SUMS.txt
            artifacts/build-info.json
            artifacts/VietMap-dSYMs.zip
            artifacts/ESIGN.md
      - name: Annotate native build failures
        if: failure()
        run: python3 scripts/annotate_build_log.py artifacts/core-tests.log artifacts/build-for-tests.log artifacts/ios-unit-tests.log artifacts/ios-ui-tests.log artifacts/archive.log
      - name: Upload test results and diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 (Node 24)
        with:
          name: VietMap-test-results
          if-no-files-found: warn
          retention-days: 7
          path: |
            artifacts/*.log
            artifacts/*.xcresult
      - name: Build summary
        run: |
          {
            echo '## VietMap · unsigned device IPA'
            echo '✅ Core tests, iOS tests, UI smoke tests and arm64 archive completed.'
            echo 'Download **VietMap-unsigned-ipa**, extract it, then sign `VietMap-unsigned.ipa` with a valid certificate and provisioning profile in ESign.'
            echo 'No Apple certificate or password was used in this workflow. Unsigned IPA cannot be installed directly.'
            echo 'SHA-256:'
            cat artifacts/SHA256SUMS.txt
            echo 'Real-world driving, background/Bluetooth behavior and actual ESign installation still require physical-device verification.'
          } >> "$GITHUB_STEP_SUMMARY"
