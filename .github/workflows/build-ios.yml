name: iOS build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: vietnav-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  traffic-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test extraction
        run: |
          python -m pip install 'osmium==4.0.2'
          python -m unittest discover -s Tests/python -v
      - name: Download Vietnam OpenStreetMap extract
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 1200 https://download.geofabrik.de/asia/vietnam-latest.osm.pbf -o "$RUNNER_TEMP/vietnam.osm.pbf"
          test -s "$RUNNER_TEMP/vietnam.osm.pbf"
      - name: Extract tagged data
        run: |
          python scripts/extract_osm.py "$RUNNER_TEMP/vietnam.osm.pbf" "$RUNNER_TEMP/traffic-data"
      - uses: actions/upload-artifact@v4
        with:
          name: VietNav-OSM-traffic-data
          path: ${{ runner.temp }}/traffic-data/
          retention-days: 14
  build:
    needs: traffic-data
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VietNav-OSM-traffic-data
          path: VietNav/Resources/TrafficData
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build unsigned iOS device app
        run: |
          set +e
          set -o pipefail
          xcodebuild build -project VietNav.xcodeproj -scheme VietNav -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$RUNNER_TEMP/build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/build.log" <<'PY'
          import sys
          lines = open(sys.argv[1], errors='replace').read().splitlines()
          errors = list(dict.fromkeys(line for line in lines if 'error:' in line.lower()))
          message = '\n'.join(errors[-50:] if errors else lines[-50:])
          print('::error::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
            exit "$status"
          fi
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/VietNav.app"
          test -f "$APP/VietNav"
          test -f "$APP/vietnam-traffic.sqlite"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$RUNNER_TEMP/VietNav-unsigned.ipa" Payload
          unzip -t "$RUNNER_TEMP/VietNav-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: VietNav-unsigned
          path: ${{ runner.temp }}/VietNav-unsigned.ipa
          retention-days: 14
  publish-data:
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/c38737e1-vietmap'
    needs: [traffic-data, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VietNav-OSM-traffic-data
          path: traffic-data
      - name: Publish versioned public data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="traffic-v4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ls -lh traffic-data/
          python scripts/make_manifest.py traffic-data/vietnam-traffic.sqlite "$TAG" traffic-data/traffic-manifest.json
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --latest=false --title "Dữ liệu OSM Việt Nam $TAG" --notes "Dữ liệu OSM thô từ Geofabrik; chưa kiểm chứng, chưa hỗ trợ cảnh báo. © OpenStreetMap contributors, ODbL."
          for file in traffic-data/vietnam-traffic.sqlite traffic-data/traffic-manifest.json traffic-data/traffic-summary.json; do
            ok=0
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$file" --clobber; then ok=1; break; fi
              echo "Upload attempt $attempt failed for $file"
            done
            if [ "$ok" -ne 1 ]; then echo "::error::Could not upload $file; release remains a draft"; exit 1; fi
          done
          gh release edit "$TAG" --draft=false --latest=false
