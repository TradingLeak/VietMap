name: iOS build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  traffic-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download Vietnam OpenStreetMap extract
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 1200 https://download.geofabrik.de/asia/vietnam-latest.osm.pbf -o "$RUNNER_TEMP/vietnam.osm.pbf"
          test -s "$RUNNER_TEMP/vietnam.osm.pbf"
      - name: Extract tagged data
        run: |
          python -m pip install 'osmium==4.0.2'
          python scripts/extract_osm.py "$RUNNER_TEMP/vietnam.osm.pbf" "$RUNNER_TEMP/traffic-data"
      - uses: actions/upload-artifact@v4
        with:
          name: VietNav-OSM-traffic-data
          path: ${{ runner.temp }}/traffic-data/
          retention-days: 14
  build:
    needs: traffic-data
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VietNav-OSM-traffic-data
          path: VietNav/Resources/TrafficData
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build unsigned iOS device app
        run: |
          set +e
          set -o pipefail
          xcodebuild build -project VietNav.xcodeproj -scheme VietNav -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$RUNNER_TEMP/build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/build.log" <<'PY'
          import sys
          lines = open(sys.argv[1], errors='replace').read().splitlines()
          errors = list(dict.fromkeys(line for line in lines if 'error:' in line.lower()))
          message = '\n'.join(errors[-50:] if errors else lines[-50:])
          print('::error::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
            exit "$status"
          fi
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/VietNav.app"
          test -f "$APP/VietNav"
          test -f "$APP/vietnam-traffic.sqlite"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$RUNNER_TEMP/VietNav-unsigned.ipa" Payload
          unzip -t "$RUNNER_TEMP/VietNav-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: VietNav-unsigned
          path: ${{ runner.temp }}/VietNav-unsigned.ipa
          retention-days: 14
