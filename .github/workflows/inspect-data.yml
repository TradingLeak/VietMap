name: Publish verified offline data
on: [push]
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VietNav-OSM-traffic-data
          run-id: 40892443441
          github-token: ${{ github.token }}
          path: /tmp/traffic
      - name: Verify and publish data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="traffic-v4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/make_manifest.py /tmp/traffic/vietnam-traffic.sqlite "$TAG" /tmp/traffic/traffic-manifest.json
          if ! gh release create "$TAG" /tmp/traffic/vietnam-traffic.sqlite /tmp/traffic/traffic-manifest.json /tmp/traffic/traffic-summary.json --target "$GITHUB_SHA" --latest=false --title "Dữ liệu OSM Việt Nam $TAG" --notes "Dữ liệu OSM thô từ Geofabrik; chưa kiểm chứng. © OpenStreetMap contributors, ODbL." > /tmp/release.log 2>&1; then
            python -c 'import pathlib; s=pathlib.Path("/tmp/release.log").read_text(errors="replace")[-4000:]; print("::error::" + s.replace("%", "%25").replace("\n", "%0A").replace("\r", "%0D"))'
            exit 1
          fi
