name: Inspect packaged data
on: [push]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VietNav-OSM-traffic-data
          run-id: 40892443441
          github-token: ${{ github.token }}
          path: /tmp/traffic
      - run: |
          set -euo pipefail
          SIZE=$(stat -c %s /tmp/traffic/vietnam-traffic.sqlite)
          echo "::notice::Database size: ${SIZE} bytes"
