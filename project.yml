name: VietNav
options:
  projectFormat: xcode15_0
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: "16.0"
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.0.0
targets:
  VietNav:
    type: application
    platform: iOS
    sources:
      - path: VietNav/App
      - path: VietNav/Map
      - path: VietNav/UI
      - path: VietNav/Resources
        buildPhase: resources
    dependencies:
      - package: MapLibre
        product: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.vietnav.app
        PRODUCT_NAME: VietNav
        INFOPLIST_FILE: VietNav/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  VietNav:
    build:
      targets:
        VietNav: all
